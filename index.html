<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시작 페이지 - StartPage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

  <!-- Header Section: Weather & Top Nav -->
  <header class="w-full p-4 md:p-6 flex justify-between items-start max-w-6xl mx-auto">
    <!-- Weather Widget -->
    <div class="bg-white/80 backdrop-blur-md p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col gap-3 min-w-[220px]">
      <div class="flex items-center gap-2 border-b border-gray-100 pb-2">
        <i class="fa-solid font-bold text-blue-500 fa-cloud-sun"></i>
        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">오늘의 날씨</span>
      </div>
      
      <div class="flex justify-between items-center text-sm">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-location-dot text-red-500"></i>
          <span class="font-medium text-gray-700">서울</span>
        </div>
        <div id="seoul-weather" class="flex items-center gap-1 font-semibold text-gray-600">
          <span class="animate-pulse text-xs text-gray-400">로딩 중...</span>
        </div>
      </div>

      <div class="flex justify-between items-center text-sm">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-location-dot text-emerald-500"></i>
          <span class="font-medium text-gray-700">제주</span>
        </div>
        <div id="jeju-weather" class="flex items-center gap-1 font-semibold text-gray-600">
          <span class="animate-pulse text-xs text-gray-400">로딩 중...</span>
        </div>
      </div>
    </div>

    <!-- Quick Links / Status -->
    <div class="flex items-center gap-3">
      <a href="https://mail.google.com" target="_blank" class="text-sm text-gray-600 hover:text-gray-900 transition">Gmail</a>
      <a href="https://images.google.com" target="_blank" class="text-sm text-gray-600 hover:text-gray-900 transition">이미지</a>
      <div class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm shadow-md">
        G
      </div>
    </div>
  </header>

  <!-- Main Content: Search & Quote -->
  <main class="w-full max-w-2xl mx-auto px-4 flex flex-col items-center -mt-12">
    <!-- Google Logo Style -->
    <div class="mb-8 select-none text-center">
      <h1 class="text-6xl md:text-7xl font-bold tracking-tight">
        <span class="text-blue-500">G</span><span class="text-red-500">o</span><span class="text-yellow-500">o</span><span class="text-blue-500">g</span><span class="text-green-500">l</span><span class="text-red-500">e</span>
      </h1>
    </div>

    <!-- Search Form -->
    <form action="https://www.google.com/search" method="GET" class="w-full mb-8">
      <div class="relative flex items-center">
        <div class="absolute left-4 text-gray-400">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <input 
          type="text" 
          name="q" 
          placeholder="구글에서 검색하거나 URL을 입력하세요" 
          required 
          autocomplete="off"
          class="w-full pl-11 pr-24 py-3.5 rounded-full border border-gray-200 shadow-sm hover:shadow-md focus:shadow-lg focus:border-transparent focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 text-base transition-all duration-200 bg-white"
        >
        <button 
          type="submit" 
          class="absolute right-2 px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium rounded-full transition duration-150 shadow-sm"
        >
          검색
        </button>
      </div>
    </form>

    <!-- Daily Quote Box -->
    <div class="w-full bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center relative group">
      <i class="fa-solid fa-quote-left text-2xl text-blue-100 absolute top-4 left-4"></i>
      <p id="quote-text" class="text-gray-700 text-base md:text-lg font-medium mb-2 relative z-10 min-h-[56px] flex items-center justify-center">
        "행동은 모든 성공의 기초 열쇠이다."
      </p>
      <p id="quote-author" class="text-xs font-semibold text-gray-400 uppercase tracking-widest">
        - 파블로 피카소 -
      </p>
      <button onclick="getRandomQuote()" class="mt-4 inline-flex items-center gap-1.5 text-xs text-gray-400 hover:text-blue-500 transition-colors">
        <i class="fa-solid fa-rotate-right"></i> 다른 명언 보기
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full p-4 text-center text-xs text-gray-400">
    <p>GitHub Pages 호환 시작 페이지 &copy; 2026</p>
  </footer>

  <!-- JavaScript logic -->
  <script>
    // 명언 데이터
    const quotes = [
      { text: "행동은 모든 성공의 기초 열쇠이다.", author: "파블로 피카소" },
      { text: "삶이 있는 한 희망은 있다.", author: "키케로" },
      { text: "어제와 똑같은 삶을 살면서 다른 미래를 기대하는 것은 정신병이다.", author: "알베르트 아인슈타인" },
      { text: "위대한 일을 하는 유일한 방법은 당신이 하는 일을 사랑하는 것이다.", author: "스티브 잡스" },
      { text: "성공은 매일 반복되는 작은 노력들의 합이다.", author: "로버트 콜리어" },
      { text: "미래를 예측하는 가장 좋은 방법은 미래를 창조하는 것이다.", author: "피터 드러커" },
      { text: "당신이 할 수 있다고 믿든 할 수 없다고 믿든, 당신이 옳다.", author: "헨리 포드" }
    ];

    function getRandomQuote() {
      const randomIndex = Math.floor(Math.random() * quotes.length);
      const quote = quotes[randomIndex];
      document.getElementById('quote-text').innerText = `"${quote.text}"`;
      document.getElementById('quote-author').innerText = `- ${quote.author} -`;
    }

    // WMO 날씨 코드를 아이콘 및 텍스트로 변환
    function getWeatherInfo(code) {
      if (code === 0) return { icon: 'fa-sun text-amber-500', label: '맑음' };
      if ([1, 2, 3].includes(code)) return { icon: 'fa-cloud-sun text-yellow-500', label: '구름조금' };
      if ([45, 48].includes(code)) return { icon: 'fa-smog text-gray-400', label: '안개' };
      if ([51, 53, 55, 61, 63, 65].includes(code)) return { icon: 'fa-cloud-rain text-blue-400', label: '비' };
      if ([71, 73, 75].includes(code)) return { icon: 'fa-snowflake text-sky-300', label: '눈' };
      if ([95, 96, 99].includes(code)) return { icon: 'fa-bolt text-purple-500', label: '뇌우' };
      return { icon: 'fa-cloud text-gray-400', label: '흐림' };
    }

    // Open-Meteo API에서 날씨 정보 불러오기
    async function fetchWeather(lat, lon, elementId) {
      try {
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
        const data = await response.json();
        const weather = data.current_weather;
        const info = getWeatherInfo(weather.weathercode);
        
        const el = document.getElementById(elementId);
        el.innerHTML = `
          <i class="fa-solid ${info.icon}"></i>
          <span>${Math.round(weather.temperature)}°C</span>
          <span class="text-xs text-gray-400 ml-0.5">(${info.label})</span>
        `;
      } catch (error) {
        document.getElementById(elementId).innerText = "오류";
      }
    }

    // 초기화 함수
    window.onload = () => {
      getRandomQuote();
      // 서울 좌표: 37.5665, 126.9780
      fetchWeather(37.5665, 126.9780, 'seoul-weather');
      // 제주 좌표: 33.4996, 126.5312
      fetchWeather(33.4996, 126.5312, 'jeju-weather');
    };
  </script>
</body>
</html>
