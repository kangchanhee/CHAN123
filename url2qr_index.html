<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR코드 생성기 - Web Utility Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
    body { font-family: 'Noto Sans KR', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="w-full p-4 border-b border-gray-100 bg-white shadow-sm">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <a href="../index.html" class="text-sm font-semibold text-gray-600 hover:text-gray-900 flex items-center gap-2 transition">
        <i class="fa-solid fa-arrow-left"></i> 메인으로 돌아가기
      </a>
      <div class="flex gap-2">
        <a href="#" class="px-3 py-1.5 text-xs bg-blue-500 text-white rounded-lg font-medium shadow-sm">QR코드 생성기</a>
        <a href="../urlShort/index.html" class="px-3 py-1.5 text-xs bg-emerald-50 text-emerald-600 hover:bg-emerald-100 rounded-lg font-medium transition">URL 단축기</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="w-full max-w-xl mx-auto px-4 py-8 flex-grow flex flex-col justify-center">
    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-md border border-gray-100">
      
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-100 text-blue-600 rounded-xl mb-3">
          <i class="fa-solid fa-qrcode text-xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">QR코드 생성 서비스</h1>
        <p class="text-xs text-gray-400 mt-1">텍스트나 주소를 입력하면 QR코드가 실시간 생성됩니다.</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">URL 또는 텍스트 입력</label>
          <input 
            type="text" 
            id="qrInput" 
            placeholder="https://example.com" 
            oninput="generateQR()"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition"
          />
        </div>

        <!-- Display Area -->
        <div class="flex flex-col items-center justify-center p-6 bg-gray-50 rounded-xl border border-dashed border-gray-200 min-h-[220px]">
          <div id="qrcode"></div>
          <p id="placeholderText" class="text-xs text-gray-400 mt-2">위 창에 내용을 입력하면 QR코드가 생성됩니다.</p>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full p-4 text-center text-xs text-gray-400 bg-white border-t border-gray-100">
    <p>GitHub Pages 호환 QR코드 생성 서비스 &copy; 2026</p>
  </footer>

  <script>
    let qrcodeObj = null;

    function generateQR() {
      const text = document.getElementById('qrInput').value.trim();
      const qrContainer = document.getElementById('qrcode');
      const placeholder = document.getElementById('placeholderText');

      qrContainer.innerHTML = '';

      if (text.length > 0) {
        placeholder.style.display = 'none';
        qrcodeObj = new QRCode(qrContainer, {
          text: text,
          width: 160,
          height: 160,
          colorDark : "#000000",
          colorLight : "#ffffff",
          correctLevel : QRCode.CorrectLevel.H
        });
      } else {
        placeholder.style.display = 'block';
      }
    }
  </script>
</body>
</html>
